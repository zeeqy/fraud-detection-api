services:
  api:
    build: .
    image: fraud-detection-api:latest
    ports:
      - "8000:8000"
    restart: unless-stopped

  demo:
    image: ghcr.io/astral-sh/uv:0.13.7-python3.12-bookworm-slim
    working_dir: /demo
    volumes:
      - ./demo:/demo:ro
    environment:
      API_URL: http://api:8000
      UV_CACHE_DIR: /tmp/uv-cache
    command: >
      uv run --no-project --with streamlit==1.* --with requests
      streamlit run app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
