[project]
name = "fraud"
version = "0.1.0"
description = "PaySim fraud detection model served as a FastAPI service with SHAP explanations"
authors = [{ name = "zeeqy" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "shap>=0.46",
    "joblib>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]
train = [
    "pyarrow>=17",
    "imbalanced-learn>=0.12",
    "mlflow>=2.16",
    "plotly>=5.24",
    "matplotlib>=3.9",
    "jupyter>=1.1",
    "nbconvert>=7",
    "kaleido>=0.2",
    "huggingface-hub>=0.25",
    "kaggle>=1.6",
]
demo = [
    "streamlit>=1.38",
    "requests>=2.32",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
