name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fraud-detection-api .
      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 --name api fraud-detection-api
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf -X POST localhost:8000/predict -H 'Content-Type: application/json' \
            -d '{"type":"TRANSFER","amount":250000,"oldbalance_orig":250000,"oldbalance_dest":0,"hour":3}' \
            | tee /dev/stderr | grep -q '"decision":"flag"'
